    <rect x='30' y='355' width='240' height='8' rx='4' fill='#38BDF8'/>

    <text x='30' y='395' fill='#C28B9A' font-family='monospace' font-size='12'>ELBOW (0 - 180 DEG): 45 DEG</text>
