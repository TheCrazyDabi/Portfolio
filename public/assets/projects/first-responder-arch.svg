<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 800' width='1200' height='800'>

<defs>
  <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#200711' />
    <stop offset='50%' stop-color='#340D1C' />
    <stop offset='100%' stop-color='#15040B' />
  </linearGradient>
</defs>

  <rect width='100%' height='100%' fill='url(#bgGrad)'/>
  <rect x='40' y='35' width='1120' height='55' rx='8' fill='#451425' stroke='#C28B9A' stroke-width='1.5'/>
  <text x='65' y='68' fill='#F7F0E7' font-family='sans-serif' font-weight='bold' font-size='20' letter-spacing='2'>AUTONOMOUS FIRST-RESPONDER // FULL SYSTEM ARCHITECTURE</text>
  <text x='960' y='68' fill='#C28B9A' font-family='monospace' font-size='16'>HARDWARE &amp; SOFTWARE</text>

  <!-- Stage 1: Sensing -->
  <g transform='translate(60, 140)'>
    <rect width='240' height='420' rx='12' fill='#120409' stroke='#641F36' stroke-width='2'/>
    <text x='20' y='40' fill='#F7F0E7' font-family='monospace' font-size='15' font-weight='bold'>1. SENSOR SUITE</text>
    <rect x='15' y='70' width='210' height='90' rx='8' fill='#240713'/>
    <text x='25' y='105' fill='#DFB9BF' font-family='sans-serif' font-weight='bold' font-size='14'>Smartphone Cam</text>
    <text x='25' y='130' fill='#C28B9A' font-family='monospace' font-size='12'>30fps 1080p Stream</text>

    <rect x='15' y='180' width='210' height='90' rx='8' fill='#240713'/>
    <text x='25' y='215' fill='#DFB9BF' font-family='sans-serif' font-weight='bold' font-size='14'>6-DOF IMU</text>
    <text x='25' y='240' fill='#C28B9A' font-family='monospace' font-size='12'>Yaw Rate &amp; Accel</text>

    <rect x='15' y='290' width='210' height='90' rx='8' fill='#240713'/>
    <text x='25' y='325' fill='#DFB9BF' font-family='sans-serif' font-weight='bold' font-size='14'>GPS Receiver</text>
    <text x='25' y='350' fill='#C28B9A' font-family='monospace' font-size='12'>Global Campus Fix</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d='M 305 350 L 345 350' stroke='#DFB9BF' stroke-width='4' marker-end='url(#arrow)'/>

  <!-- Stage 2: Edge Computing -->
  <g transform='translate(350, 140)'>
    <rect width='300' height='420' rx='12' fill='#120409' stroke='#641F36' stroke-width='2'/>
    <text x='20' y='40' fill='#10B981' font-family='monospace' font-size='15' font-weight='bold'>2. JETSON ORIN NANO</text>
    
    <rect x='15' y='70' width='270' height='100' rx='8' fill='#240713'/>
    <text x='25' y='105' fill='#38BDF8' font-family='sans-serif' font-weight='bold' font-size='14'>YOLOv8 / PIDNet-S</text>
    <text x='25' y='130' fill='#C28B9A' font-family='monospace' font-size='12'>Pathway Instance Segmentation</text>
    <text x='25' y='150' fill='#10B981' font-family='monospace' font-size='12'>Real-time TensorRT: 38 FPS</text>

    <rect x='15' y='190' width='270' height='100' rx='8' fill='#240713'/>
    <text x='25' y='225' fill='#F59E0B' font-family='sans-serif' font-weight='bold' font-size='14'>ROS 2 Humble / Nav2</text>
    <text x='25' y='250' fill='#C28B9A' font-family='monospace' font-size='12'>Costmap 2D + DWB Planner</text>
    <text x='25' y='270' fill='#DFB9BF' font-family='monospace' font-size='12'>Dynamic Obstacle Avoidance</text>

    <rect x='15' y='310' width='270' height='80' rx='8' fill='#240713'/>
    <text x='25' y='340' fill='#DFB9BF' font-family='sans-serif' font-weight='bold' font-size='14'>MQTT Reverse Bridge</text>
    <text x='25' y='365' fill='#C28B9A' font-family='monospace' font-size='12'>Mobile Dispatch Ingestion</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d='M 655 350 L 695 350' stroke='#DFB9BF' stroke-width='4'/>

  <!-- Stage 3: Low-Level Controller & CAN -->
  <g transform='translate(700, 140)'>
    <rect width='220' height='420' rx='12' fill='#120409' stroke='#641F36' stroke-width='2'/>
    <text x='20' y='40' fill='#F59E0B' font-family='monospace' font-size='15' font-weight='bold'>3. CAN BUS DBW</text>
    
    <rect x='15' y='70' width='190' height='140' rx='8' fill='#240713'/>
    <text x='25' y='105' fill='#DFB9BF' font-family='sans-serif' font-weight='bold' font-size='14'>CAN Transceiver</text>
    <text x='25' y='135' fill='#C28B9A' font-family='monospace' font-size='12'>500 kbps Baud</text>
    <text x='25' y='160' fill='#C28B9A' font-family='monospace' font-size='12'>Steer: 0x120</text>
    <text x='25' y='185' fill='#C28B9A' font-family='monospace' font-size='12'>Throttle: 0x124</text>

    <rect x='15' y='230' width='190' height='160' rx='8' fill='#240713'/>
    <text x='25' y='265' fill='#EF4444' font-family='sans-serif' font-weight='bold' font-size='14'>Safety Gatekeeper</text>
    <text x='25' y='295' fill='#C28B9A' font-family='monospace' font-size='12'>Manual Override</text>
    <text x='25' y='320' fill='#C28B9A' font-family='monospace' font-size='12'>E-Stop Watchdog</text>
    <text x='25' y='345' fill='#10B981' font-family='monospace' font-size='12'>Heartbeat: 50Hz</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d='M 925 350 L 965 350' stroke='#DFB9BF' stroke-width='4'/>

  <!-- Stage 4: Actuation -->
  <g transform='translate(970, 140)'>
    <rect width='170' height='420' rx='12' fill='#120409' stroke='#641F36' stroke-width='2'/>
    <text x='20' y='40' fill='#EF4444' font-family='monospace' font-size='15' font-weight='bold'>4. ACTUATION</text>
    
    <rect x='15' y='70' width='140' height='90' rx='8' fill='#240713'/>
    <text x='25' y='105' fill='#DFB9BF' font-family='sans-serif' font-weight='bold' font-size='13'>Linear Steer</text>
    <text x='25' y='130' fill='#C28B9A' font-family='monospace' font-size='11'>High-Torque</text>

    <rect x='15' y='180' width='140' height='90' rx='8' fill='#240713'/>
    <text x='25' y='215' fill='#DFB9BF' font-family='sans-serif' font-weight='bold' font-size='13'>Hydraulic Brake</text>
    <text x='25' y='240' fill='#C28B9A' font-family='monospace' font-size='11'>Solenoid Mod</text>

    <rect x='15' y='290' width='140' height='90' rx='8' fill='#240713'/>
    <text x='25' y='325' fill='#DFB9BF' font-family='sans-serif' font-weight='bold' font-size='13'>EV Throttle</text>
    <text x='25' y='350' fill='#C28B9A' font-family='monospace' font-size='11'>PWM Controller</text>
  </g>

  <!-- Bottom Banner -->
  <rect x='40' y='630' width='1120' height='120' rx='10' fill='#380F1F' stroke='#641F36' stroke-width='1.5'/>
  <text x='65' y='665' fill='#DFB9BF' font-family='serif' font-size='20' font-weight='bold'>End-to-End Emergency Dispatch &amp; Drive-by-Wire Control Pipeline</text>
  <text x='65' y='695' fill='#F7F0E7' font-family='sans-serif' font-size='14'>Designed by Vasudev Saras K M: Mechatronics Architecture for Saintgits S8 Milestone</text>
  <text x='65' y='722' fill='#C28B9A' font-family='monospace' font-size='13'>Sensor Ingestion -&gt; Jetson TensorRT Inference -&gt; Nav2 Costmap Trajectory -&gt; CAN Bus Actuation</text>
</svg>