[package]
name = "kinematics-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Vasudev Saras K M <vasudevsaraskm@gmail.com>"]
description = "Analytical inverse kinematics and Ackermann vehicle steering solver compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
